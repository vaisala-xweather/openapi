# Validate document structure with Redocly and API policy with Spectral.
extends: spectral:oas

aliases:
  WeatherOperation:
    - $.paths[*][get,put,post,delete,options,head,patch,trace,query]
    - $.paths[*].additionalOperations[*]

rules:
  # Spectral 6.16.3 / rulesets 1.22.7 only recognize the 3.0 and 3.1 dialects.
  # They otherwise validate 3.2 schemas as 3.0 / draft-04. Redocly handles
  # document structure and examples until Spectral supports 3.2 natively.
  oas3-schema: off
  oas3-valid-media-example: off
  oas3-valid-schema-example: off

  # IDs, parameters and response declarations affect generated clients.
  operation-operationId: error
  operation-parameters: error
  operation-success-response: error
  oas3-operation-security-defined: error

  # Tool importers need descriptions without fetching a separate docs page.
  operation-description: error
  oas3-parameter-description: error

  xweather-tool-operation-id:
    description: Operation IDs must be usable as tool names (letters, digits, underscores or hyphens, at most 64 characters).
    severity: error
    given: '#WeatherOperation'
    then:
      field: operationId
      function: pattern
      functionOptions:
        match: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'

  xweather-https-servers:
    description: Published server URLs must use HTTPS, including path and operation overrides.
    severity: error
    given:
      - $.servers[*].url
      - $.paths[*].servers[*].url
      - '#WeatherOperation.servers[*].url'
    then:
      function: pattern
      functionOptions:
        match: '^https://[^/\s?#]+(?:[^\s]*)$'

  xweather-security-required:
    description: The published Weather API must declare authentication at the document level.
    severity: error
    given: $
    then:
      field: security
      function: truthy

  xweather-paired-credentials:
    description: Every authentication alternative must require BOTH clientId and clientSecret; anonymous overrides are not supported.
    severity: error
    given:
      - $.security
      - '#WeatherOperation.security'
    then:
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1
          items:
            type: object
            required: [clientId, clientSecret]
            properties:
              clientId:
                type: array
                maxItems: 0
              clientSecret:
                type: array
                maxItems: 0

  xweather-query-auth-schemes:
    description: Credential schemes must describe the existing client_id and client_secret query parameters.
    severity: error
    given: $
    then:
      field: components.securitySchemes
      function: schema
      functionOptions:
        schema:
          type: object
          required: [clientId, clientSecret]
          properties:
            clientId:
              type: object
              required: [type, in, name]
              properties:
                type:
                  const: apiKey
                in:
                  const: query
                name:
                  const: client_id
            clientSecret:
              type: object
              required: [type, in, name]
              properties:
                type:
                  const: apiKey
                in:
                  const: query
                name:
                  const: client_secret

  xweather-common-responses:
    description: Document handled requests and the shared authentication, routing, rate-limit and server errors.
    severity: error
    given: '#WeatherOperation'
    then:
      field: responses
      function: schema
      functionOptions:
        schema:
          type: object
          required: ['200', '401', '404', '429', '500']

  xweather-json-response-schema:
    description: Each operation must describe its HTTP 200 JSON response schema.
    severity: error
    given: '#WeatherOperation'
    then:
      field: responses.200.content.application/json.schema
      function: truthy

  xweather-cost-headers:
    description: HTTP 200 responses must document the three Weather API cost headers.
    severity: error
    given: '#WeatherOperation.responses["200"]'
    then:
      field: headers
      function: schema
      functionOptions:
        schema:
          type: object
          required: [X-Cost-Endpoint, X-Cost-Multipliers, X-Cost-Tokens]
